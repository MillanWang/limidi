<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0f0f" />
    <meta name="robots" content="noindex" />
    <title>Not found — LiMIDI</title>
    <link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0a0a12;
        color: #e5e7eb;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        min-height: 100vh;
      }
      body {
        background:
          radial-gradient(60% 50% at 20% 10%, rgba(168, 85, 247, 0.18), transparent 70%),
          radial-gradient(50% 40% at 85% 20%, rgba(34, 211, 238, 0.14), transparent 70%),
          linear-gradient(180deg, #0a0a12 0%, #0d0d18 50%, #0a0a12 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 520px;
        text-align: center;
      }
      .eyebrow {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #c4b5fd;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 56px;
        font-weight: 700;
        line-height: 1;
        margin: 0 0 16px;
        background: linear-gradient(120deg, #a855f7, #ec4899 50%, #22d3ee);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      p {
        color: #cbd5e1;
        line-height: 1.6;
        margin: 0 0 24px;
      }
      a.button {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 12px;
        background: linear-gradient(120deg, #a855f7, #7c3aed 50%, #22d3ee);
        color: white;
        font-weight: 600;
        text-decoration: none;
        box-shadow: 0 10px 30px -10px rgba(168, 85, 247, 0.5);
        transition: transform 150ms ease, box-shadow 200ms ease;
      }
      a.button:hover {
        transform: translateY(-1px);
        box-shadow: 0 15px 40px -10px rgba(168, 85, 247, 0.7);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Off the grid</p>
      <h1>404</h1>
      <p>This page doesn't exist — but the music does. Head back to the homepage.</p>
      <a class="button" href="/">Back to LiMIDI</a>
    </main>
  </body>
</html>
