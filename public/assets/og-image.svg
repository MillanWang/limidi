<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a12" />
      <stop offset="100%" stop-color="#1a0a2a" />
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.2" r="0.5">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.85" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow1)" />
  <rect width="1200" height="630" fill="url(#glow2)" />

  <g
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    text-anchor="middle"
    transform="translate(0, 8)"
  >
    <text x="600" y="188" font-size="20" font-weight="600" fill="#c4b5fd" letter-spacing="0.2em">
      LiMIDI
    </text>

    <text x="600" y="302" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-0.04em">
      Your iPhone is now a MIDI controller
    </text>

    <text x="600" y="372" font-size="24" font-weight="500" fill="#cbd5e1">
      Custom layouts for macOS DAWs — wireless and free.
    </text>

    <text x="600" y="422" font-size="19" font-weight="500" fill="#94a3b8">
      Logic, Ableton, FL Studio, Pro Tools, GarageBand, Reaper, and more.
    </text>
  </g>
</svg>
